<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .text-ovr,
      .text-load {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 190px;
        fill: #0F0F0F;
        letter-spacing: -0.05em;
      }
    </style>
  </defs>
  <!-- Inverted plate: primary yellow field, dark type — readable on light browser chrome -->
  <rect width="512" height="512" fill="#CCFF00"/>
  <g text-anchor="middle">
    <text x="256" y="215" class="text-ovr">OVR</text>
    <text x="256" y="395" class="text-load">LOAD</text>
  </g>
</svg>
